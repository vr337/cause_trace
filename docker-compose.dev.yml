# 本地开发依赖：MySQL + Redis。启动后执行 `uv run alembic upgrade head` 建表。
#
# 数据用 bind mount 落到本地目录而不是具名卷，方便直接查看/清理库文件，
# 备份时也能整目录拷贝。
services:
  # 归因主服务。PDF 导出依赖 WeasyPrint 的 Pango/Cairo，只在容器里可用，
  # 所以本地开发也走这个服务，不要试图在 Windows 上装 GTK。
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cause-api
    environment:
      CAUSE_DATABASE_URL: mysql+pymysql://cause:causepass@mysql:3306/cause?charset=utf8mb4
      CAUSE_WAREHOUSE_READONLY_URL: mysql+pymysql://cause_ro:readonly_pass@mysql:3306/warehouse?charset=utf8mb4
      CAUSE_SANDBOX_INTERNAL_TOKEN: ${CAUSE_SANDBOX_INTERNAL_TOKEN:-dev-internal-token}
    ports:
      - "7300:7300"
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      # 导出产物落本地，方便直接查看
      - ./exports:/app/exports
    profiles: ["api"]

  mysql:
    image: mysql:8.4
    container_name: cause-mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: cause
      MYSQL_USER: cause
      MYSQL_PASSWORD: causepass
    ports:
      - "3306:3306"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - D:\Documents\Docker\volume\app\cause_trace\mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-prootpass"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:8-alpine
    container_name: cause-redis
    ports:
      - "6380:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - D:\Documents\Docker\volume\app\cause_trace\redis:/data
