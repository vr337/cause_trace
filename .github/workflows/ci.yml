name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # WeasyPrint 的 Pango/Cairo 与中文字体：CI 里也真实验证 PDF 渲染，
      # 而不是把 PDF 用例跳过
      - name: 安装 PDF 渲染依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpango-1.0-0 libpangoft2-1.0-0 libcairo2 libgdk-pixbuf-2.0-0 \
            libffi8 shared-mime-info fonts-noto-cjk

      - name: 安装依赖
        run: uv sync --dev

      - name: 代码风格检查
        run: uv run ruff check src tests scripts

      - name: 单元测试（守恒性硬校验）
        run: uv run pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: 安装依赖
        run: npm ci

      - name: 类型检查与构建
        run: npm run build

      - name: 单元测试
        run: npm run test
